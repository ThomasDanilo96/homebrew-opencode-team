rules:
  - id: python.subprocess-shell-true
    languages: [python]
    severity: WARNING
    message: Subprocess invocation enables a shell; verify data cannot control the command.
    pattern: subprocess.$FUNC(..., shell=True, ...)
  - id: python.sql-string-concat
    languages: [python]
    severity: WARNING
    message: SQL is assembled with string concatenation; verify parameters are safely bound.
    pattern: $CURSOR.execute($QUERY + $INPUT)
  - id: javascript.eval
    languages: [javascript, typescript]
    severity: WARNING
    message: Dynamic eval can execute untrusted input.
    pattern: eval($INPUT)
  - id: javascript.innerhtml
    languages: [javascript, typescript]
    severity: WARNING
    message: Assigning innerHTML can introduce DOM-based XSS.
    pattern: $ELEMENT.innerHTML = $INPUT
