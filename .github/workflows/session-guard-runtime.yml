name: Session Guard runtime qualification

on: workflow_dispatch

permissions:
  contents: read

jobs:
  runtime:
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: ubuntu-24.04, target: linux-x64-baseline }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: Homebrew/actions/setup-homebrew@master
      - name: Build pinned source and stage an unpublished Homebrew package
        run: |
          bash .github/scripts/build-team-runtime.sh "$TARGET" "$RUNNER_TEMP/runtime"
          archive="$RUNNER_TEMP/opencode-team-0.3.13.tar.gz"
          git archive --format=tar.gz --prefix=opencode-team-0.3.13/ "$GITHUB_SHA" > "$archive"
          sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          brew tap-new --no-git opencode-team/staging
          formula="$(brew --repo opencode-team/staging)/Formula/opencode-team-staging.rb"
          ruby .github/scripts/render-staging-formula.rb --runtime Formula/opencode-team.rb "$formula" \
            OpencodeTeamStaging 0.3.13 "file://$archive" "$sha" \
            "$RUNNER_TEMP/runtime/runtime-lock.json" "$RUNNER_TEMP/runtime"
          brew install opencode-team/staging/opencode-team-staging
          brew test --force opencode-team/staging/opencode-team-staging
          prefix="$(brew --prefix opencode-team/staging/opencode-team-staging)"
          "$prefix/bin/opencode-team" version
          printf 'TEAM_PACKAGE=%s\n' "$prefix/libexec" >> "$GITHUB_ENV"
      - name: Verify installed native TUI behavior on macOS
        if: runner.os == 'macOS'
        run: |
          brew install tmux
          SESSION_GUARD_TEST_INLINE_PLUGIN=1 python3 "$TEAM_PACKAGE/tests/session-guard-native.py" \
            "$TEAM_PACKAGE/runtime/opencode"
      - name: Verify installed native TUI behavior on isolated Linux
        if: runner.os == 'Linux'
        run: |
          docker build --tag opencode-team-native-test - <<'DOCKERFILE'
          FROM ubuntu:24.04@sha256:562111b88caa79c71391c0c4d3c2114a7d5c35915c20561fd893cb1e07929e6b
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 tmux
          DOCKERFILE
          docker run --rm --network none --read-only --tmpfs /tmp:exec \
            -e HOME=/tmp -e SESSION_GUARD_TEST_INLINE_PLUGIN=1 \
            --mount "type=bind,source=$TEAM_PACKAGE,target=/keg,readonly" \
            opencode-team-native-test python3 /keg/tests/session-guard-native.py /keg/runtime/opencode
      - name: Verify same-formula Homebrew upgrade and rollback
        run: |
          name=opencode-team/staging/opencode-team-staging
          formula="$(brew --repo opencode-team/staging)/Formula/opencode-team-staging.rb"
          cp "$formula" "$RUNNER_TEMP/new.rb"
          archive="$RUNNER_TEMP/opencode-team-0.3.12.tar.gz"
          git archive --format=tar.gz --prefix=opencode-team-0.3.12/ v0.3.12 > "$archive"
          git show v0.3.12:Formula/opencode-team.rb > "$RUNNER_TEMP/old-template.rb"
          sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          ruby .github/scripts/render-staging-formula.rb "$RUNNER_TEMP/old-template.rb" "$RUNNER_TEMP/old.rb" \
            OpencodeTeamStaging 0.3.12 "file://$archive" "$sha"
          brew uninstall --formula "$name"
          cp "$RUNNER_TEMP/old.rb" "$formula"
          brew install "$name"
          test "$(opencode-team version)" = "OpenCode Team 0.3.12"
          cp "$RUNNER_TEMP/new.rb" "$formula"
          brew upgrade --formula --no-ask "$name"
          test "$(opencode-team version)" = "OpenCode Team 0.3.13"
          test -d "$(brew --cellar "$name")/0.3.12"
          cp "$RUNNER_TEMP/old.rb" "$formula"
          brew uninstall --formula "$name"
          brew link "$name"
          test "$(opencode-team version)" = "OpenCode Team 0.3.12"
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-team-runtime-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/runtime/opencode-team-runtime-*.tar.gz
            ${{ runner.temp }}/runtime/runtime-lock.json
