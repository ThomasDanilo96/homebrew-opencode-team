name: Homebrew Install

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  clean-install:
    runs-on: macos-14
    steps:
      - name: Tap and trust formula
        run: |
          brew tap ThomasDanilo96/opencode-team
          brew trust --formula ThomasDanilo96/opencode-team/opencode-team
          brew trust --formula anomalyco/tap/opencode

      - name: Install from tap
        run: brew install ThomasDanilo96/opencode-team/opencode-team

      - name: Verify toolchain
        run: |
          test "$(opencode-team version)" = "OpenCode Team 0.1.0"
          node --version
          opencode --version
          python3 --version
          jq --version
          tmux -V
          uv --version
          rg --version
          package_root="$(brew --cellar opencode-team)/0.1.0/libexec"
          test -x "$package_root/bin/opencode-team"
          test "$(opencode-team version)" = "OpenCode Team 0.1.0"

      - name: Clean-room setup and doctor
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          OPENCODE_TEAM_HOME="$test_home" opencode-team setup
          OPENCODE_TEAM_HOME="$test_home" opencode-team doctor

          test -x "$test_home/data/bin/serena"
          for team in best go openai; do
            test -f "$test_home/config/$team/team-runtime.conf"
            test -f "$test_home/config/$team/opencode.jsonc"
          done

          package_root="$(brew --cellar opencode-team)/0.1.0/libexec"
          OPENCODE_TEAM_HOME="$test_home" bash "$package_root/tests/config-parity.sh"
          ! rg -n '/Users/|\.opencode-team-staging|go-final-ux-v1|best-shared-v1' "$test_home"
          test "$(shasum -a 256 "$test_home/data/dependencies/best/node_modules/oh-my-openagent/dist/index.js" | cut -d' ' -f1)" = "a022deff9202c97e922a4a75c357beab420907f724fe9214267dad53fe72455e"
          test "$(shasum -a 256 "$test_home/data/dependencies/go/node_modules/oh-my-openagent/dist/index.js" | cut -d' ' -f1)" = "cf01dcad9a7a1b09840bf5f92d0dfb11cc724cdd00f32aa4c5a87af227c5b5bc"

      - name: Formula test and audit
        run: |
          brew test ThomasDanilo96/opencode-team/opencode-team
          brew audit --strict ThomasDanilo96/opencode-team/opencode-team

      - name: Disposable runtime smoke
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          OPENCODE_TEAM_HOME="$test_home" opencode-team setup >/dev/null
          for team in best go openai; do
            run_dir="$(mktemp -d)"
            log="$run_dir/runtime.log"
            (cd "$run_dir" && OPENCODE_TEAM_HOME="$test_home" TMUX=1 opencode-team "$team") >"$log" 2>&1 &
            pid=$!
            ready=0
            for _ in $(seq 1 45); do
              if rg -q 'Server ready|Parent session' "$log"; then ready=1; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            test "$ready" -eq 1
            kill -TERM "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            for _ in $(seq 1 15); do
              if ! ps -axo pid=,command= | rg "$test_home" | rg -v 'rg ' >/dev/null; then break; fi
              sleep 1
            done
            ! ps -axo pid=,command= | rg "$test_home" | rg -v 'rg '
            rm -rf "$run_dir"
          done
