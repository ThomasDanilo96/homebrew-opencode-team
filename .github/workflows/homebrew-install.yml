name: Homebrew Install

on:
  push:
    branches: [master, "prerelease/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      official_archive_sha256:
        description: SHA-256 measured from the published vVERSION source archive after the authorized tag exists
        required: false
        type: string
      publish_stable_release:
        description: Create the GitHub Release only after the stable tap clean-install passes
        required: false
        default: false
        type: boolean

jobs:
  source-validation:
    runs-on: macos-14
    steps:
      - name: Checkout development code
        uses: actions/checkout@v4

      - name: Validate source workflow contracts
        run: |
          expected_version="$(tr -d '[:space:]' < VERSION)"
          [[ "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          brew install actionlint
          actionlint .github/workflows/homebrew-install.yml
          bash tests/homebrew-workflow.test.sh
          ruby -c Formula/opencode-team.rb
          ruby -c .github/scripts/render-staging-formula.rb
          node --test tests/opencode-team-launcher-regression.test.mjs
          node --test tests/best-ecc-config.test.mjs tests/best-cli-routing.test.mjs
          node --test tests/deep-audit-cli.test.mjs
          node --test tests/deep-audit-report.test.mjs
           node --test tests/deep-audit-scanner.test.mjs
           node --test tests/deep-audit-test-runner.e2e.mjs
          bash tests/deep-audit-sandbox.test.sh
          bash -n tests/deep-audit-runtime-smoke.sh
          bash tests/core-resume.test.sh
          node --check shared/response-copy/exporter.js
          node --check shared/response-copy/runtime-source.js
          node --check teams/best/best-native-router.mjs
          node --check teams/best/best-router-contract.mjs
          node --test tests/best-native-router.test.mjs

  release_state:
    needs: source-validation
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release_state.outputs.published }}
    steps:
      - name: Checkout development code
        uses: actions/checkout@v4

      - name: Check target release publication
        id: release_state
        run: |
          expected_version="$(tr -d '[:space:]' < VERSION)"
          [[ "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$expected_version"
          if ! tag_result="$(git ls-remote origin "refs/tags/$tag" 2>&1)"; then
            printf 'Unable to check publication state for %s:\n%s\n' "$tag" "$tag_result" >&2
            exit 1
          fi
          if [[ -z "$tag_result" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Target tag $tag is not published yet; skipping tap installation until a later workflow dispatch."
          else
            resolved_ref="$(printf '%s\n' "$tag_result" | awk 'NR == 1 { print $2 }')"
            if [[ "$resolved_ref" != "refs/tags/$tag" ]]; then
              printf 'Unexpected ref while checking %s: %s\n' "$tag" "$tag_result" >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Target tag $tag is published; running clean-room tap installation."
          fi

  prepublication-staging:
    needs: [source-validation, release_state]
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/prerelease/') && needs.release_state.outputs.published == 'false'
    # This runner is disposable. The staging keg/formula never touches the stable tap.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Refresh Homebrew metadata and preflight bottles
        run: |
          brew update
          for dependency in git jq node@22 ripgrep terminal-notifier tmux uv opencode gitleaks; do
            brew fetch --force-bottle "$dependency"
          done
          opencode_version="$(brew info --json=v2 opencode | jq -r '.formulae[0].versions.stable')"
          test -n "$opencode_version"
          ruby -e 'abort "OpenCode #{ARGV[0]} is below required minimum 1.18.30" if Gem::Version.new(ARGV[0]) < Gem::Version.new("1.18.30")' "$opencode_version"
          brew install --force-bottle opencode gitleaks
          docker info --format '{{.OSType}} {{.Architecture}}'

      - name: Build candidate source artifact and ephemeral formula
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          candidate_branch="prerelease/v$version"
          test "$GITHUB_REF_NAME" = "$candidate_branch"
          candidate_sha="$(git rev-parse HEAD)"
          test "$candidate_sha" = "$GITHUB_SHA"
          archive="$RUNNER_TEMP/opencode-team-$version-staging.tar.gz"
          brew tap-new --no-git opencode-team/staging
          formula="$(brew --repo opencode-team/staging)/Formula/opencode-team-staging.rb"
          git archive --format=tar.gz --prefix="opencode-team-$version/" "$candidate_sha" >"$archive"
          # This digest belongs only to the disposable staging artifact and is never copied
          # into Formula/opencode-team.rb or used as a release checksum.
          staging_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          ruby .github/scripts/render-staging-formula.rb \
            Formula/opencode-team.rb "$formula" OpencodeTeamStaging "$version" \
            "file://$archive" "$staging_sha256"
          ruby -c "$formula"
          printf 'staging_artifact=%s\nstaging_formula=%s\nstaging_sha256=%s\n' \
            "$archive" "$formula" "$staging_sha256" >>"$GITHUB_OUTPUT"

      - name: Install and test isolated staging formula
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          formula="opencode-team/staging/opencode-team-staging"
          version="$(tr -d '[:space:]' < VERSION)"
          brew install --verbose "$formula"
          brew test --verbose --force "$formula"
          test "$(command -v opencode-team)" = "$(brew --prefix)/bin/opencode-team"
          test "$(cd "$RUNNER_TEMP" && opencode-team version)" = "OpenCode Team $version"
          package_root="$(brew --prefix opencode-team/staging/opencode-team-staging)/libexec"
          test -x "$package_root/bin/opencode-team"
          test -x "$package_root/teams/deep-audit/bin/read-only-opencode.sh"
          test -f "$package_root/teams/deep-audit/setup-scanners.sh"
          test -f "$package_root/teams/deep-audit/setup-test-runners.sh"
          node --test "$package_root/tests/opencode-team-launcher-regression.test.mjs"
          gitleaks dir "$package_root"
          CI=true OPENCODE_TEAM_TEST_SKIP_TIME_MACHINE=1 \
            OPENCODE_TEAM_PACKAGE_ROOT="$package_root" bash "$package_root/tests/setup-smoke.sh"

  official-archive-validation:
    needs: [source-validation, release_state]
    if: needs.release_state.outputs.published == 'true' && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.official_archive_sha256 != ''))
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release procedure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Preflight inputs, bottles, and official archive checksum
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ inputs.official_archive_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$EXPECTED_ARCHIVE_SHA256" ]; then
            [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi
          brew update
          for dependency in git jq node@22 ripgrep terminal-notifier tmux uv opencode gitleaks; do
            brew fetch --force-bottle "$dependency"
          done
          opencode_version="$(brew info --json=v2 opencode | jq -r '.formulae[0].versions.stable')"
          test -n "$opencode_version"
          ruby -e 'abort "OpenCode #{ARGV[0]} is below required minimum 1.18.30" if Gem::Version.new(ARGV[0]) < Gem::Version.new("1.18.30")' "$opencode_version"
          brew install --force-bottle opencode gitleaks
          version="$(tr -d '[:space:]' < VERSION)"
          candidate_branch="prerelease/v$version"
          tag_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$GITHUB_SHA"
          phase_a_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Homebrew Install" --branch "$candidate_branch" --limit 100 --json databaseId,headSha,event,conclusion)"
          phase_a_run_id="$(printf '%s' "$phase_a_runs" | jq -r --arg sha "$tag_commit" '[.[] | select(.headSha == $sha and .event == "workflow_dispatch" and .conclusion == "success")][0].databaseId // empty')"
          if [ -z "$phase_a_run_id" ]; then
            printf 'No successful Phase A run found for candidate commit %s on %s\n' "$tag_commit" "$candidate_branch" >&2
            exit 1
          fi
          phase_a_job="$(gh run view "$phase_a_run_id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.name == "prepublication-staging") | .conclusion')"
          if [ "$phase_a_job" != success ]; then
            printf 'Phase A staging job for %s did not pass (result: %s)\n' "$tag_commit" "${phase_a_job:-missing}" >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/opencode-team-$version-official.tar.gz"
          archive_url="https://github.com/ThomasDanilo96/homebrew-opencode-team/archive/refs/tags/v$version.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 "$archive_url" -o "$archive"
          actual_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          if [ -n "$EXPECTED_ARCHIVE_SHA256" ] && [ "$actual_sha256" != "$EXPECTED_ARCHIVE_SHA256" ]; then
            printf 'Official archive SHA-256 mismatch: expected %s, got %s\n' "$EXPECTED_ARCHIVE_SHA256" "$actual_sha256" >&2
            exit 1
          fi
          printf 'Verified official archive SHA-256: %s\n' "$actual_sha256"
          docker info --format '{{.OSType}} {{.Architecture}}'

      - name: Verify the published archive with a temporary formula
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          EXPECTED_ARCHIVE_SHA256: ${{ inputs.official_archive_sha256 }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          archive_url="https://github.com/ThomasDanilo96/homebrew-opencode-team/archive/refs/tags/v$version.tar.gz"
          archive="$RUNNER_TEMP/opencode-team-$version-official.tar.gz"
          actual_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          if [ -n "$EXPECTED_ARCHIVE_SHA256" ] && [ "$actual_sha256" != "$EXPECTED_ARCHIVE_SHA256" ]; then
            printf 'Official archive SHA-256 mismatch: expected %s, got %s\n' "$EXPECTED_ARCHIVE_SHA256" "$actual_sha256" >&2
            exit 1
          fi
          brew tap-new --no-git opencode-team/staging
          formula="$(brew --repo opencode-team/staging)/Formula/opencode-team-official.rb"
          ruby .github/scripts/render-staging-formula.rb \
            Formula/opencode-team.rb "$formula" OpencodeTeamOfficial "$version" \
            "$archive_url" "$actual_sha256"
          ruby -c "$formula"
          brew install --verbose opencode-team/staging/opencode-team-official
          brew test --verbose --force opencode-team/staging/opencode-team-official
          package_root="$(brew --prefix opencode-team/staging/opencode-team-official)/libexec"
          test "$(command -v opencode-team)" = "$(brew --prefix)/bin/opencode-team"
          test "$(cd "$RUNNER_TEMP" && opencode-team version)" = "OpenCode Team $version"
          node --test "$package_root/tests/opencode-team-launcher-regression.test.mjs"
          gitleaks dir "$package_root"
          CI=true OPENCODE_TEAM_TEST_SKIP_TIME_MACHINE=1 \
            OPENCODE_TEAM_PACKAGE_ROOT="$package_root" bash "$package_root/tests/setup-smoke.sh"

  clean-install:
    needs: release_state
    if: needs.release_state.outputs.published == 'true' && !((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.official_archive_sha256 != ''))
    # The current node@22 bottle is available on Tahoe; macos-14 would build V8 from source.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout development code
        uses: actions/checkout@v4

      - name: Refresh Homebrew metadata and preflight dependencies
        run: |
          brew update
          # Fail before installing the formula if any direct dependency lacks a runner bottle.
          for dependency in git jq node@22 ripgrep terminal-notifier tmux uv opencode; do
            brew fetch --force-bottle "$dependency"
          done
          opencode_version="$(brew info --json=v2 opencode | jq -r '.formulae[0].versions.stable')"
          test -n "$opencode_version"
          ruby -e 'abort "OpenCode #{ARGV[0]} is below required minimum 1.18.30" if Gem::Version.new(ARGV[0]) < Gem::Version.new("1.18.30")' "$opencode_version"

      - name: Tap and trust formula
        run: |
          brew tap ThomasDanilo96/opencode-team
          brew trust --formula ThomasDanilo96/opencode-team/opencode-team

      - name: Verify formula selects the published release archive
        run: |
          expected_version="$(tr -d '[:space:]' < VERSION)"
          expected_url="https://github.com/ThomasDanilo96/homebrew-opencode-team/archive/refs/tags/v${expected_version}.tar.gz"
          formula_url="$(brew info --json=v2 ThomasDanilo96/opencode-team/opencode-team | jq -r '.formulae[0].urls.stable.url')"
          formula_sha256="$(brew info --json=v2 ThomasDanilo96/opencode-team/opencode-team | jq -r '.formulae[0].urls.stable.checksum')"
          source_sha256="$(ruby -e 'puts File.read("Formula/opencode-team.rb")[/^  sha256 "([0-9a-f]{64})"$/, 1]')"
          if [ "$formula_url" != "$expected_url" ]; then
            printf 'Formula archive mismatch: expected %s, got %s\n' "$expected_url" "$formula_url" >&2
            exit 1
          fi
          if [ -z "$source_sha256" ] || [ "$formula_sha256" != "$source_sha256" ]; then
            printf 'Tap formula checksum mismatch: source %s, tap %s\n' "$source_sha256" "$formula_sha256" >&2
            exit 1
          fi
          # Fetch the same source archive selected by the tap formula; Homebrew verifies
          # its declared SHA-256 during installation.
          brew fetch --force ThomasDanilo96/opencode-team/opencode-team

      - name: Install from tap
        run: HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install --verbose ThomasDanilo96/opencode-team/opencode-team

      - name: Verify toolchain
        run: |
          sw_vers
          uname -m
          brew --prefix
          expected_version="$(tr -d '[:space:]' < VERSION)"
          test "$(command -v opencode-team)" = "$(brew --prefix)/bin/opencode-team"
          test "$(opencode-team version)" = "OpenCode Team $expected_version"
          node --version
          git --version
          jq --version
          tmux -V
          uv --version
          rg --version
          curl --version
          package_root="$(brew --prefix opencode-team)/libexec"
          test -x "$package_root/bin/opencode-team"
          test "$(opencode-team version)" = "OpenCode Team $expected_version"

      - name: Verify launcher in installed release archive
        run: node --test "$(brew --prefix opencode-team)/libexec/tests/opencode-team-launcher-regression.test.mjs"

      - name: Clean-room setup and doctor
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
            shared_dependencies="$RUNNER_TEMP/opencode-team-clean-install-dependencies"
            OPENCODE_TEAM_TEST_SKIP_TIME_MACHINE=1 OPENCODE_TEAM_HOME="$test_home" OPENCODE_TEAM_DEPENDENCY_ROOT="$shared_dependencies" opencode-team setup
            ecc_models="$(XDG_CONFIG_HOME="$test_home/config/best-ecc/xdg-config" XDG_DATA_HOME="$test_home/data/best-ecc/data" OPENCODE_CONFIG="$test_home/config/best-ecc/opencode.jsonc" OPENCODE_CONFIG_DIR="$test_home/config/best-ecc" OPENCODE_DISABLE_PROJECT_CONFIG=1 opencode models openai)"
           printf '%s\n' "$ecc_models" | rg -q '^openai/gpt-6-luna$'
           go_models="$(XDG_CONFIG_HOME="$test_home/config/best-ecc/xdg-config" XDG_DATA_HOME="$test_home/data/best-ecc/data" OPENCODE_CONFIG="$test_home/config/best-ecc/opencode.jsonc" OPENCODE_CONFIG_DIR="$test_home/config/best-ecc" OPENCODE_DISABLE_PROJECT_CONFIG=1 opencode models opencode-go)"
           printf '%s\n' "$go_models" | rg -q '^opencode-go/qwen3\.7-plus$'
           audit_models="$(XDG_CONFIG_HOME="$test_home/config/deep-audit/xdg-config" XDG_DATA_HOME="$test_home/data/deep-audit/data" OPENCODE_CONFIG="$test_home/config/deep-audit/opencode.jsonc" OPENCODE_CONFIG_DIR="$test_home/config/deep-audit" OPENCODE_DISABLE_PROJECT_CONFIG=1 opencode models openai)"
           printf '%s\n' "$audit_models" | rg -q '^openai/gpt-6-astra$'
           printf '%s\n' "$audit_models" | rg -q '^openai/gpt-6.1-sol$'
           OPENCODE_TEAM_DEEP_AUDIT_REPORT_PLUGIN="$test_home/data/deep-audit/plugins/report-plugin.mjs" node tests/deep-audit-report.test.mjs
           OPENCODE_TEAM_DEEP_AUDIT_SCANNER_PLUGIN="$test_home/data/deep-audit/plugins/scanner-plugin.mjs" OPENCODE_TEAM_DEEP_AUDIT_SCANNER_ROOT="$shared_dependencies/deep-audit/scanners" OPENCODE_TEAM_DEEP_AUDIT_RULES_ROOT="$package_root/teams/deep-audit/rules" node tests/deep-audit-scanner.test.mjs
           audit_python="$(awk -F= '$1 == "OPENCODE_TEAM_PYTHON" { print substr($0, index($0, "=") + 1) }' "$test_home/config/deep-audit/team-runtime.conf")"
           OPENCODE_TEAM_PYTHON="$audit_python" bash tests/deep-audit-sandbox.test.sh
            if OPENCODE_TEAM_HOME="$test_home" OPENCODE_TEAM_DEPENDENCY_ROOT="$shared_dependencies" opencode-team deep-audit-doctor >"$test_home/deep-audit-doctor.out" 2>&1; then
              echo "Deep Audit doctor should remain NOT READY without profile OAuth/scanner dependencies in clean CI" >&2
              exit 1
            fi
            rg -q 'Runtime tool state[[:space:]]+VERIFIED .*Serena MCP connected/read-only call executed; no model request' "$test_home/deep-audit-doctor.out"
            rg -q 'Deep Audit models[[:space:]]+OK' "$test_home/deep-audit-doctor.out"
           rg -q 'Read-only sandbox[[:space:]]+OK' "$test_home/deep-audit-doctor.out"
           rg -q 'Deep Audit auth[[:space:]]+REQUIRED' "$test_home/deep-audit-doctor.out"
           for scanner in jscpd ast-grep semgrep gitleaks osv-scanner ruff vulture knip bandit pip-audit sqlfluff pytest; do
             rg -q "${scanner}[[:space:]]+AVAILABLE" "$test_home/deep-audit-doctor.out"
           done
           opencode --version
          opencode_prefix="$(brew --prefix opencode)"
          test -x "$opencode_prefix/bin/opencode"

          managed_python="$(awk -F= '$1 == "OPENCODE_TEAM_PYTHON" { print substr($0, index($0, "=") + 1) }' "$test_home/config/best/team-runtime.conf")"
          test -x "$managed_python"
          case "$managed_python" in
            "$shared_dependencies/python/"*) ;;
            *) echo "managed Python escaped dependency root: $managed_python" >&2; exit 1 ;;
          esac
          MANAGED_PYTHON_ROOT="$shared_dependencies/python" "$managed_python" - <<'PY'
          import pathlib
          import plistlib
          import sqlite3
          import sys
          import xml.parsers.expat

          root = pathlib.Path(__import__("os").environ["MANAGED_PYTHON_ROOT"]).resolve()
          paths = [sys.executable, sys.prefix, sys.base_prefix, getattr(sys, "_base_executable", None)]
          assert sys.version_info[:2] == (3, 13), sys.version
          for value in paths:
              assert value is not None
              assert pathlib.Path(value).resolve().is_relative_to(root), (value, root)
          plistlib.dumps({"managed": True})
          sqlite3.connect(":memory:").close()
          xml.parsers.expat.ParserCreate()
          PY

          test -x "$shared_dependencies/bin/serena"
           for team in best best-ecc deep-audit go openai daily; do
            test -f "$test_home/config/$team/team-runtime.conf"
            test -f "$test_home/config/$team/opencode.jsonc"
          done

          package_root="$(brew --prefix opencode-team)/libexec"
          for required_file in \
            "$package_root/shared/response-copy/package.json" \
            "$package_root/shared/response-copy/runtime-source.js" \
            "$package_root/shared/response-copy/safe-parts.js" \
            "$package_root/shared/response-copy/exporter.js" \
            "$package_root/shared/response-copy/formatter.js" \
            "$package_root/shared/response-copy/response-copy-plugin.js" \
             "$package_root/teams/best/tui.json.template" \
             "$package_root/teams/best/oh-my-openagent.jsonc.template" \
             "$package_root/teams/best/omo.jsonc.template" \
             "$package_root/teams/best/best-native-router.mjs" \
             "$package_root/teams/best/best-router-contract.mjs" \
             "$package_root/teams/best-ecc/opencode.jsonc.template" \
             "$package_root/teams/best-ecc/omo.jsonc.template" \
             "$package_root/teams/best-ecc/setup-ecc.sh" \
              "$package_root/teams/best-ecc/claude-config/settings.json.template" \
               "$package_root/teams/deep-audit/opencode.jsonc.template" \
               "$package_root/teams/deep-audit/team-runtime.conf.template" \
               "$package_root/teams/deep-audit/runtime-env.sh" \
               "$package_root/teams/deep-audit/setup-ecc.sh" \
              "$package_root/teams/deep-audit/report-plugin.mjs.template" \
               "$package_root/teams/deep-audit/scanner-plugin.mjs.template" \
               "$package_root/teams/deep-audit/test-runner-plugin.mjs.template" \
               "$package_root/teams/deep-audit/test-runner-integrity.mjs" \
               "$package_root/teams/deep-audit/setup-test-runners.sh" \
               "$package_root/teams/deep-audit/test-runners/images.lock.json" \
               "$package_root/teams/deep-audit/test-runners/python.Dockerfile" \
               "$package_root/teams/deep-audit/test-runners/php.Dockerfile" \
               "$package_root/teams/deep-audit/test-runners/python-requirements.txt" \
               "$package_root/teams/deep-audit/bin/test-runner-health.mjs" \
              "$package_root/teams/deep-audit/setup-scanners.sh" \
              "$package_root/teams/deep-audit/scanners/package.json" \
              "$package_root/teams/deep-audit/scanners/package-lock.json" \
              "$package_root/teams/deep-audit/scanners/pyproject.toml" \
              "$package_root/teams/deep-audit/scanners/uv.lock" \
              "$package_root/teams/deep-audit/rules/semgrep.yml" \
              "$package_root/teams/deep-audit/rules/ast-grep.yml" \
               "$package_root/teams/deep-audit/report-schema.md" \
              "$package_root/teams/deep-audit/bin/read-only-opencode.sh" \
              "$package_root/teams/deep-audit/bin/report.mjs" \
              "$package_root/tests/deep-audit-cli.test.mjs" \
              "$package_root/tests/deep-audit-report.test.mjs" \
              "$package_root/tests/deep-audit-scanner.test.mjs" \
              "$package_root/tests/deep-audit-sandbox.test.sh" \
               "$package_root/tests/deep-audit-runtime-smoke.sh" \
               "$package_root/tests/deep-audit-test-runner.e2e.mjs" \
             "$package_root/teams/best-ecc/ecc.lock" \
             "$package_root/tests/best-native-router.test.mjs" \
             "$package_root/tests/best-ecc-config.test.mjs" \
             "$package_root/tests/best-omo-v5-patch.test.mjs" \
             "$package_root/teams/go/tui.json.template" \
            "$package_root/teams/openai/tui.json.template" \
            "$package_root/core/lib/runtime-manifest.mjs" \
            "$package_root/core/lib/runtime-lifecycle.mjs" \
            "$package_root/core/lib/runtime-reaper.sh"; do
            test -f "$required_file"
          done
           test -f "$test_home/state/maintenance/launchagents/it.danilodantoni.opencode-team.runtime-gc.plist"
           node --test "$package_root/shared/response-copy/tests/"*.test.mjs
             OPENCODE_TEAM_PACKAGE_ROOT="$package_root" OPENCODE_TEAM_HOME="$test_home" OPENCODE_TEAM_DEPENDENCY_ROOT="$shared_dependencies" bash "$GITHUB_WORKSPACE/tests/config-parity.sh"
           OPENCODE_TEAM_HOME="$test_home" OPENCODE_TEAM_DEPENDENCY_ROOT="$shared_dependencies" opencode-team doctor
            OPENCODE_TEAM_PACKAGE_ROOT="$package_root" OPENCODE_TEAM_TEST_DEPENDENCY_ROOT="$shared_dependencies" bash "$GITHUB_WORKSPACE/tests/setup-smoke.sh"
          bash "$package_root/tests/runtime-readiness.test.sh"
          if rg -n '/Users/|\.opencode-team-staging|go-final-ux-v1|best-shared-v1' "$test_home/config" "$test_home/state" "$test_home/cache/runtime"; then
            exit 1
          fi
          bash "$package_root/teams/best/verify-omo.sh" "$shared_dependencies/best/node_modules/oh-my-openagent/dist/index.js"
          bash "$package_root/teams/go/verify-omo.sh" "$shared_dependencies/go/node_modules/oh-my-openagent/dist/index.js"

      - name: Formula test and audit
        run: |
          brew test ThomasDanilo96/opencode-team/opencode-team
          brew audit --strict --formula ThomasDanilo96/opencode-team/opencode-team

      - name: Installed maintenance regression
        run: |
          node_prefix="$(brew --prefix node@22)"
          export PATH="$node_prefix/bin:$PATH"
          package_root="$(brew --prefix opencode-team)/libexec"
          expected_version="$(tr -d '[:space:]' < VERSION)"
          test "$(opencode-team version)" = "OpenCode Team $expected_version"
          test -f "$package_root/shared/maintenance/run-maintenance.sh"
          test -f "$package_root/shared/maintenance/opencode-cleanup.py"
          test -f "$package_root/shared/maintenance/openai-state-retention.mjs"
          test -f "$package_root/tests/maintenance-smoke.sh"
           OPENCODE_TEAM_CLI=opencode-team \
             bash "$GITHUB_WORKSPACE/tests/maintenance-smoke.sh"

      - name: Disposable runtime smoke
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
           shared_dependencies="$RUNNER_TEMP/opencode-team-clean-install-dependencies"
            OPENCODE_TEAM_TEST_SKIP_TIME_MACHINE=1 OPENCODE_TEAM_HOME="$test_home" OPENCODE_TEAM_DEPENDENCY_ROOT="$shared_dependencies" opencode-team setup >/dev/null
            tmux_socket="opencode-team-ci-$$"
          export TMUX_TMPDIR=/tmp
          for team in best best-ecc deep-audit go openai daily; do
            run_dir="$(mktemp -d)"
            log="$run_dir/runtime.log"
            session="opencode-team-ci-$team-$$"
            launch_team="$team"
            if [ "$team" = best ]; then launch_team=best-opencode; fi
            tmux -L "$tmux_socket" new-session -d -s "$session" \
              "cd '$run_dir' && HOME='$test_home' OPENCODE_TEAM_HOME='$test_home' OPENCODE_TEAM_DEPENDENCY_ROOT='$shared_dependencies' opencode-team '$launch_team' >'$log' 2>&1"
            ready=0
            for _ in $(seq 1 45); do
              readiness="$(HOME="$test_home" OPENCODE_TEAM_HOME="$test_home" OPENCODE_TEAM_DEPENDENCY_ROOT="$shared_dependencies" opencode-team runtime-readiness 2>/dev/null || true)"
              if printf '%s' "$readiness" | jq -e '(.ready == true) and any(.runs[]; .state == "ACTIVE" and (.parent_session_id | length > 0) and .identity.launcher == "alive" and .identity.server == "alive")' >/dev/null 2>&1; then ready=1; break; fi
              if ! tmux -L "$tmux_socket" has-session -t "$session" 2>/dev/null; then break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Runtime smoke did not become ready for $team; last readiness: $readiness" >&2
              cat "$log" >&2
              exit 1
            fi
            run_state_dir="$(find "$test_home/cache/runtime/$team/runs" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            if [ -z "$run_state_dir" ]; then
              echo "Runtime smoke for $team reached READY without a run-state directory" >&2
              tmux -L "$tmux_socket" kill-session -t "$session" 2>/dev/null || true
              exit 1
            fi
            for _ in $(seq 1 15); do
              if [ -s "$run_state_dir/attach.pid" ] && [ -f "$run_state_dir/attach.identity" ]; then break; fi
              sleep 1
            done
            if [ ! -s "$run_state_dir/attach.pid" ] || [ ! -f "$run_state_dir/attach.identity" ]; then
              echo "Runtime smoke could not find the $team attach process" >&2
              tmux -L "$tmux_socket" kill-session -t "$session" 2>/dev/null || true
              exit 1
            fi
            run_id="$(cat "$run_state_dir/run_id")"
            attach_pid="$(cat "$run_state_dir/attach.pid")"
            attach_identity="$run_state_dir/attach.identity"
            if [ -z "$run_id" ] || [ -z "$attach_pid" ] || [ ! -f "$attach_identity" ]; then
              echo "Runtime smoke cannot verify the $team attach identity" >&2
              tmux -L "$tmux_socket" kill-session -t "$session" 2>/dev/null || true
              exit 1
            fi
            identity_pid="$(awk -F= '$1 == "pid" { print $2 }' "$attach_identity")"
            identity_run_id="$(awk -F= '$1 == "run_id" { print $2 }' "$attach_identity")"
            identity_start_epoch="$(awk -F= '$1 == "start_epoch" { print $2 }' "$attach_identity")"
            identity_role="$(awk -F= '$1 == "role" { print $2 }' "$attach_identity")"
            attach_start="$(LC_ALL=C ps -p "$attach_pid" -o lstart= 2>/dev/null || true)"
            attach_start_epoch="$(LC_ALL=C date -j -f "%a %b %d %T %Y" "$attach_start" "+%s" 2>/dev/null || true)"
            if [ "$identity_pid" != "$attach_pid" ] || [ "$identity_run_id" != "$run_id" ] || [ "$identity_start_epoch" != "$attach_start_epoch" ] || [ "$identity_role" != "attach" ]; then
              echo "Runtime smoke refused to signal an unverified $team attach process" >&2
              tmux -L "$tmux_socket" kill-session -t "$session" 2>/dev/null || true
              exit 1
            fi
            if ! kill -TERM "$attach_pid"; then
              echo "Runtime smoke could not signal the verified $team attach process $attach_pid" >&2
              tmux -L "$tmux_socket" kill-session -t "$session" 2>/dev/null || true
              exit 1
            fi
            runtime_stopped=0
            for _ in $(seq 1 30); do
              if [ ! -d "$run_state_dir" ]; then runtime_stopped=1; break; fi
              sleep 1
            done
            if [ "$runtime_stopped" -ne 1 ]; then
              echo "Runtime smoke did not cleanly stop $team attach process $attach_pid" >&2
              cat "$log" >&2
            fi
            tmux -L "$tmux_socket" kill-session -t "$session" 2>/dev/null || true
            for _ in $(seq 1 15); do
              if ! ps -axo pid=,command= | rg "$test_home" | rg -v 'rg ' >/dev/null; then break; fi
              sleep 1
            done
            remaining_processes="$(ps -axo pid=,command= | rg "$test_home" | rg -v 'rg ' || true)"
            if [ -n "$remaining_processes" ]; then
              echo "Runtime smoke left processes for $team:" >&2
              printf '%s\n' "$remaining_processes" >&2
              exit 1
            fi
            remaining_runs="$(find "$test_home/cache/runtime/$team/runs" -mindepth 1 -maxdepth 1 -type d -print 2>/dev/null || true)"
            if [ -n "$remaining_runs" ]; then
              echo "Runtime smoke left run state for $team:" >&2
              printf '%s\n' "$remaining_runs" >&2
              echo "Runtime log for $team:" >&2
              cat "$log" >&2
              while IFS= read -r run_state_dir; do
                [ -n "$run_state_dir" ] || continue
                echo "Runtime state files for $team ($run_state_dir):" >&2
                for state_file in state status failure_reason; do
                  if [ -f "$run_state_dir/$state_file" ]; then
                    printf '%s: ' "$state_file" >&2
                    tr '\n' ' ' < "$run_state_dir/$state_file" >&2
                    printf '\n' >&2
                  fi
                done
                node "$package_root/core/lib/runtime-manifest.mjs" "$run_state_dir" status >&2 || true
              done <<< "$remaining_runs"
              exit 1
            fi
           if [ "$runtime_stopped" -ne 1 ]; then exit 1; fi
           rm -rf "$run_dir"
          done

  publish-stable-release:
    needs: [source-validation, release_state, clean-install]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_stable_release && needs.release_state.outputs.published == 'true' && needs.clean-install.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout verified release source
        uses: actions/checkout@v4

      - name: Publish stable GitHub Release after green install gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; refusing to replace it." >&2
            exit 1
          fi
          gh release create "$tag" --title "OpenCode Team $tag" --generate-notes --verify-tag
