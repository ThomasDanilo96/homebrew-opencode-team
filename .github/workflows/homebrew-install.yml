name: Homebrew Install

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  clean-install:
    runs-on: macos-14
    steps:
      - name: Checkout development code
        uses: actions/checkout@v4

      - name: Tap and trust formula
        run: |
          brew tap ThomasDanilo96/opencode-team
          brew tap anomalyco/tap
          brew trust --formula ThomasDanilo96/opencode-team/opencode-team
          brew trust --formula anomalyco/tap/opencode

      - name: Install from tap
        run: brew install ThomasDanilo96/opencode-team/opencode-team

      - name: Verify toolchain
        run: |
          sw_vers
          uname -m
          brew --prefix
          test "$(opencode-team version)" = "OpenCode Team 0.1.14"
          node --version
          opencode --version
          python3 --version
          jq --version
          tmux -V
          uv --version
          rg --version
          package_root="$(brew --prefix opencode-team)/libexec"
          test -x "$package_root/bin/opencode-team"
          test "$(opencode-team version)" = "OpenCode Team 0.1.14"

      - name: Clean-room setup and doctor
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          shared_dependencies="$test_home/shared-dependencies"
          OPENCODE_TEAM_HOME="$test_home" OPENCODE_TEAM_DEPENDENCY_ROOT="$shared_dependencies" opencode-team setup
          OPENCODE_TEAM_HOME="$test_home" OPENCODE_TEAM_DEPENDENCY_ROOT="$shared_dependencies" opencode-team doctor

          test -x "$shared_dependencies/bin/serena"
          for team in best go openai daily; do
            test -f "$test_home/config/$team/team-runtime.conf"
            test -f "$test_home/config/$team/opencode.jsonc"
          done

          package_root="$(brew --prefix opencode-team)/libexec"
          for required_file in \
            "$package_root/shared/response-copy/package.json" \
            "$package_root/shared/response-copy/runtime-source.js" \
            "$package_root/shared/response-copy/safe-parts.js" \
            "$package_root/shared/response-copy/exporter.js" \
            "$package_root/shared/response-copy/formatter.js" \
            "$package_root/shared/response-copy/response-copy-plugin.js" \
            "$package_root/teams/best/tui.json.template" \
            "$package_root/teams/go/tui.json.template" \
            "$package_root/teams/openai/tui.json.template" \
            "$package_root/core/lib/runtime-manifest.mjs" \
            "$package_root/core/lib/runtime-lifecycle.mjs" \
            "$package_root/core/lib/runtime-reaper.sh"; do
            test -f "$required_file"
          done
          test -f "$test_home/state/maintenance/launchagents/it.danilodantoni.opencode-team.runtime-gc.plist"
          node --test "$package_root/shared/response-copy/tests/"*.test.mjs
          OPENCODE_TEAM_PACKAGE_ROOT="$package_root" OPENCODE_TEAM_HOME="$test_home" OPENCODE_TEAM_DEPENDENCY_ROOT="$shared_dependencies" bash "$GITHUB_WORKSPACE/tests/config-parity.sh"
          OPENCODE_TEAM_TEST_DEPENDENCY_ROOT="$test_home/setup-smoke-dependencies" bash "$package_root/tests/setup-smoke.sh"
          bash "$package_root/tests/runtime-readiness.test.sh"
          ! rg -n '/Users/|\.opencode-team-staging|go-final-ux-v1|best-shared-v1' "$test_home/config" "$test_home/state" "$test_home/cache/runtime"
          test "$(shasum -a 256 "$shared_dependencies/best/node_modules/oh-my-openagent/dist/index.js" | cut -d' ' -f1)" = "a022deff9202c97e922a4a75c357beab420907f724fe9214267dad53fe72455e"
          test "$(shasum -a 256 "$shared_dependencies/go/node_modules/oh-my-openagent/dist/index.js" | cut -d' ' -f1)" = "cf01dcad9a7a1b09840bf5f92d0dfb11cc724cdd00f32aa4c5a87af227c5b5bc"

      - name: Formula test and audit
        run: |
          brew test ThomasDanilo96/opencode-team/opencode-team
          brew audit --strict --formula ThomasDanilo96/opencode-team/opencode-team

      - name: Installed v0.1.14 maintenance regression
        run: |
          export PATH="$(brew --prefix node@22)/bin:$PATH"
          package_root="$(brew --prefix opencode-team)/libexec"
          test "$(opencode-team version)" = "OpenCode Team 0.1.14"
          test -f "$package_root/shared/maintenance/run-maintenance.sh"
          test -f "$package_root/shared/maintenance/opencode-cleanup.py"
          test -f "$package_root/shared/maintenance/openai-state-retention.mjs"
          test -f "$package_root/tests/maintenance-smoke.sh"
           OPENCODE_TEAM_CLI=opencode-team \
             bash "$GITHUB_WORKSPACE/tests/maintenance-smoke.sh"

      - name: Disposable runtime smoke
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          shared_dependencies="$test_home/shared-dependencies"
          OPENCODE_TEAM_HOME="$test_home" OPENCODE_TEAM_DEPENDENCY_ROOT="$shared_dependencies" opencode-team setup >/dev/null
          tmux_socket="opencode-team-ci-$$"
          export TMUX_TMPDIR=/tmp
          for team in best go openai daily; do
            run_dir="$(mktemp -d)"
            log="$run_dir/runtime.log"
            session="opencode-team-ci-$team-$$"
            tmux -L "$tmux_socket" new-session -d -s "$session" \
              "cd '$run_dir' && HOME='$test_home' OPENCODE_TEAM_HOME='$test_home' OPENCODE_TEAM_DEPENDENCY_ROOT='$shared_dependencies' opencode-team '$team' >'$log' 2>&1"
            ready=0
            for _ in $(seq 1 45); do
              readiness="$(HOME="$test_home" OPENCODE_TEAM_HOME="$test_home" OPENCODE_TEAM_DEPENDENCY_ROOT="$shared_dependencies" opencode-team runtime-readiness 2>/dev/null || true)"
              if printf '%s' "$readiness" | jq -e '(.ready == true) and any(.runs[]; .state == "ACTIVE" and (.parent_session_id | length > 0) and .identity.launcher == "alive" and .identity.server == "alive")' >/dev/null 2>&1; then ready=1; break; fi
              if ! tmux -L "$tmux_socket" has-session -t "$session" 2>/dev/null; then break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then cat "$log" >&2; fi
            test "$ready" -eq 1
            tmux -L "$tmux_socket" kill-session -t "$session" 2>/dev/null || true
            for _ in $(seq 1 15); do
              if ! ps -axo pid=,command= | rg "$test_home" | rg -v 'rg ' >/dev/null; then break; fi
              sleep 1
            done
            ! ps -axo pid=,command= | rg "$test_home" | rg -v 'rg '
            test "$(find "$test_home/cache/runtime/$team/runs" -mindepth 1 -maxdepth 1 -type d -print 2>/dev/null | wc -l | tr -d ' ')" = 0
            rm -rf "$run_dir"
          done
